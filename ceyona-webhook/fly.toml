# fly.toml app configuration file generated for ceyona-webhook on 2026-06-16T22:45:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ceyona-webhook'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
