name: OCI Ampere A1 Auto-Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' '${{ secrets.OCI_PRIVATE_KEY }}' > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/root/.oci/oci_api_key.pem
          EOF

      - name: Setup VCN and Subnet (if not exists)
        id: network
        run: |
          COMPARTMENT="${{ secrets.OCI_COMPARTMENT_OCID }}"

          # Ищем существующий VCN
          VCN_ID=$(oci network vcn list \
            --compartment-id "$COMPARTMENT" \
            --query 'data[?contains("display-name", `ceyona`)].id | [0]' \
            --raw-output 2>/dev/null || echo "")

          if [ -z "$VCN_ID" ] || [ "$VCN_ID" = "null" ]; then
            echo "Создаём VCN..."
            VCN_ID=$(oci network vcn create \
              --compartment-id "$COMPARTMENT" \
              --cidr-block "10.0.0.0/16" \
              --display-name "ceyona-vcn" \
              --wait-for-state AVAILABLE \
              --query 'data.id' --raw-output 2>/dev/null)
            
            # Internet Gateway
            IGW_ID=$(oci network internet-gateway create \
              --compartment-id "$COMPARTMENT" \
              --vcn-id "$VCN_ID" \
              --is-enabled true \
              --display-name "ceyona-igw" \
              --wait-for-state AVAILABLE \
              --query 'data.id' --raw-output 2>/dev/null)

            # Route table
            RT_ID=$(oci network route-table list \
              --compartment-id "$COMPARTMENT" \
              --vcn-id "$VCN_ID" \
              --query 'data[0].id' --raw-output 2>/dev/null)

            oci network route-table update \
              --rt-id "$RT_ID" \
              --route-rules "[{\"networkEntityId\":\"$IGW_ID\",\"destination\":\"0.0.0.0/0\",\"destinationType\":\"CIDR_BLOCK\"}]" \
              --force 2>/dev/null

            # Subnet
            SUBNET_ID=$(oci network subnet create \
              --compartment-id "$COMPARTMENT" \
              --vcn-id "$VCN_ID" \
              --cidr-block "10.0.0.0/24" \
              --display-name "ceyona-subnet" \
              --route-table-id "$RT_ID" \
              --wait-for-state AVAILABLE \
              --query 'data.id' --raw-output 2>/dev/null)
          else
            echo "VCN уже существует: $VCN_ID"
            SUBNET_ID=$(oci network subnet list \
              --compartment-id "$COMPARTMENT" \
              --vcn-id "$VCN_ID" \
              --query 'data[0].id' --raw-output 2>/dev/null)
          fi

          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "Subnet: $SUBNET_ID"

      - name: Find Ubuntu 22.04 ARM image
        id: image
        run: |
          IMAGE_OCID=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --limit 1 \
            --query 'data[0].id' \
            --raw-output 2>/dev/null)
          echo "ocid=$IMAGE_OCID" >> $GITHUB_OUTPUT
          echo "Image: $IMAGE_OCID"

      - name: Try all ADs until success
        id: provision
        run: |
          ADS=("KZeC:EU-FRANKFURT-1-AD-1" "KZeC:EU-FRANKFURT-1-AD-2" "KZeC:EU-FRANKFURT-1-AD-3")
          VM_CREATED=false

          for AD in "${ADS[@]}"; do
            echo "→ Пробуем $AD..."
            RESULT=$(oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --image-id "${{ steps.image.outputs.ocid }}" \
              --subnet-id "${{ steps.network.outputs.subnet_id }}" \
              --assign-public-ip true \
              --ssh-authorized-keys-file <(echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}") \
              --display-name "ceyona-bot" \
              2>&1 || true)

            if echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['id'])" 2>/dev/null; then
              INSTANCE_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['id'])")
              echo "✅ VM создаётся: $INSTANCE_ID"

              for i in $(seq 1 30); do
                sleep 10
                STATE=$(oci compute instance get --instance-id "$INSTANCE_ID" \
                  --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "UNKNOWN")
                echo "  Статус: $STATE ($i/30)"
                if [ "$STATE" = "RUNNING" ]; then
                  PUBLIC_IP=$(oci compute instance list-vnics \
                    --instance-id "$INSTANCE_ID" \
                    --query 'data[0]."public-ip"' --raw-output 2>/dev/null || echo "нет IP")
                  echo "vm_created=true" >> $GITHUB_OUTPUT
                  echo "vm_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
                  echo "vm_ad=$AD" >> $GITHUB_OUTPUT
                  VM_CREATED=true
                  break
                fi
              done
              break
            else
              ERR=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message','unknown'))" 2>/dev/null || echo "ошибка парсинга")
              echo "✗ $AD: $ERR"
            fi
          done

          if [ "$VM_CREATED" = "false" ]; then
            echo "vm_created=false" >> $GITHUB_OUTPUT
            echo "⏳ Все AD заняты, следующая попытка через 5 минут."
          fi

      - name: Notify Telegram
        if: steps.provision.outputs.vm_created == 'true'
        run: |
          TEXT="✅ Oracle VM создана!%0A%0A🌐 IP: ${{ steps.provision.outputs.vm_ip }}%0A📍 AD: ${{ steps.provision.outputs.vm_ad }}%0A%0AОтключи этот workflow в GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT_ID }}&text=$TEXT&parse_mode=HTML"