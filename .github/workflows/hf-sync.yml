name: Sync to HF Space

on:
  push:
    branches: [main]
    paths:
      - 'project-root/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          cd project-root
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.sha }}" > .rebuild-trigger
          git init
          git add .
          git commit -m "sync: ${{ github.sha }}"
          git remote add hf https://Warren97:$HF_TOKEN@huggingface.co/spaces/Warren97/ceyona
          git push hf master:main --force