name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ruff
        run: pip install ruff

      - name: Auto-fix imports and style
        run: |
          ruff check project-root --fix --ignore E402,E501,B005,F601,F841,B905,B007 || true

      - name: Commit fixes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "style: auto-fix ruff [skip ci]")
          git push || true

  test:
    runs-on: ubuntu-latest
    needs: lint-fix
    defaults:
      run:
        working-directory: project-root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('project-root/pyproject.toml') }}
      - run: pip install --upgrade pip
      - run: pip install -e .
      - name: Check critical imports
        run: |
          python -c "import contracts.shared_types"
          python -c "import cognition.intent_engine"
          python -c "import core.execution.orchestrator"
          python -c "import retrieval.retrieval_engine"
          python -c "import context.assembler"
      - name: Ruff check
        run: |
          pip install ruff
          ruff check . --ignore E402,E501,B005,F601,F841,B905,B007
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          pytest -q --tb=short

  deploy-searxng:
    name: Deploy SearXNG
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app if not exists
        run: |
          fly apps list --org personal | grep -q "ceyona-searxng" \
            || fly apps create ceyona-searxng --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Create volume if not exists
        run: |
          fly volumes list --app ceyona-searxng | grep -q "searxng_data" \
            || fly volumes create searxng_data --region fra --size 1 --app ceyona-searxng --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy SearXNG
        run: fly deploy --app ceyona-searxng --config fly.toml
        working-directory: searxng
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Set SEARXNG_URL in main app
        run: |
          fly secrets set SEARXNG_URL="https://ceyona-searxng.fly.dev" --app ceyona
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
