name: Keepalive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep workflows active
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['oci-provision-a.yml'];
            for (const wf of workflows) {
              try {
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf
                });
                console.log(`Enabled: ${wf}`);
              } catch(e) {
                console.log(`${wf}: ${e.message}`);
              }
            }