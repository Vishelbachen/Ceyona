name = "ceyona-webhook"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
FORWARD_TIMEOUT = "20000"
TELEGRAM_PROXY_TIMEOUT = "10000"

# Keep-alive: пингует HF Space каждые 10 минут через scheduled() в worker.js,
# чтобы снизить вероятность холодного старта к моменту реального сообщения
# от пользователя. НЕ гарантирует, что Space никогда не заснёт — это
# управляется на стороне HF — поэтому Worker всё равно рассчитан на то,
# что Space иногда будет холодным (см. wake-up пинг + retry в forwardToHF).
[triggers]
crons = ["*/10 * * * *"]