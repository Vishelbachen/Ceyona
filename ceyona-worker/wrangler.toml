name = "ceyona-webhook"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
TELEGRAM_PROXY_TIMEOUT = "10000"

# РЕШЕНИЕ (2026-07): cron не используется вообще, ни для keep-alive,
# ни для drainOutbox — по вашему явному выбору избегать любого
# Cloudflare-расписанного трафика к HF. Вся отправка событийная:
# Supabase Database Webhook на INSERT в таблицу outbox шлёт HTTP POST
# на маршрут /outbox/drain этого Worker'а (см. worker.js), который
# и вызывает drainOutbox() — без scheduled(), без cron-триггера.
#
# Компромисс, который стоит держать в голове (не блокирующий, просто
# факт): у Database Webhook нет встроенного retry на уровне доставки
# самого HTTP-вызова Supabase → Worker. Если конкретный вызов не
# дойдёт (Worker временно недоступен, деплой и т.п.), эта конкретная
# строка останется в outbox со статусом 'pending' и next_retry_at в
# прошлом — она отправится только тогда, когда придёт следующее новое
# сообщение и снова вызовет drainOutbox (drainOutbox каждый раз читает
# ВСЕ готовые к отправке pending-строки, а не только новую). Если бот
# активен, это практически не создаёт задержки. Если хотите закрыть
# и этот редкий край случая — POST /outbox/drain можно вызвать вручную
# в любой момент (curl, из браузера, из внешнего мониторинга) — это
# просто HTTP-эндпоинт, не расписание, вызывать его нужно самому и
# только когда реально понадобилось (например, увидели зависшую
# запись через GET /outbox/health).

# Включает Workers Logs постоянно — переживает деплои и не выключается
# само по себе из дашборда, в отличие от ручного тумблера в Settings.
[observability]
enabled = true