name = "ceyona-webhook"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
TELEGRAM_PROXY_TIMEOUT = "10000"

# Keep-alive: пингует HF Space каждые 10 минут через scheduled() в worker.js,
# чтобы снизить вероятность холодного старта к моменту, когда HF-consumer
# пойдёт вычитывать очередь pending_updates. НЕ гарантирует, что Space
# никогда не заснёт — это управляется на стороне HF.
[triggers]
crons = ["*/10 * * * *"]

# Включает Workers Logs постоянно — переживает деплои и не выключается
# само по себе из дашборда, в отличие от ручного тумблера в Settings.
[observability]
enabled = true