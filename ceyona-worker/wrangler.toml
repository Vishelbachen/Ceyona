name = "ceyona-webhook"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
TELEGRAM_PROXY_TIMEOUT = "10000"

# Keep-alive cron отключён — убран по решению пользователя из-за риска
# HF abuse-detector флага по правилу "Cloudflare" (не подтверждён точно
# для этого проекта, но пользователь предпочёл не рисковать).
# [triggers]
# crons = ["*/10 * * * *"]

# Включает Workers Logs постоянно — переживает деплои и не выключается
# само по себе из дашборда, в отличие от ручного тумблера в Settings.
[observability]
enabled = true