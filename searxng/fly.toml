app = 'ceyona-searxng'
primary_region = 'fra'

[build]
  image = 'searxng/searxng:latest'

[env]
  SEARXNG_BASE_URL = 'https://ceyona-searxng.fly.dev'
  BIND_ADDRESS     = '0.0.0.0:8080'

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ['app']

  [[http_service.checks]]
    grace_period = "15s"
    interval     = "30s"
    method       = "GET"
    path         = "/healthz"
    timeout      = "5s"

[[vm]]
  memory   = '512mb'
  cpu_kind = 'shared'
  cpus     = 1

[mounts]
  source      = 'searxng_data'
  destination = '/etc/searxng'