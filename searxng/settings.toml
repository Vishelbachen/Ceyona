# SearXNG configuration for Ceyona
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  # Must match SEARXNG_BASE_URL in fly.toml
  base_url: https://ceyona-searxng.fly.dev
  secret_key: "REPLACE_WITH_OUTPUT_OF: openssl rand -hex 32"
  limiter: false        # отключаем — у нас только один клиент (Ceyona)
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""      # пустой = определяется из запроса
  languages:
    - all

# Включаем JSON формат — критически важно для search.py
formats:
  - html
  - json

# Только самые стабильные движки
engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    disabled: false

# Отключаем UI фичи — нам нужен только API
ui:
  static_use_hash: false
  default_locale: en
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  results_on_new_tab: false
  simple_style: auto

# Отключаем Redis — нет Redis у SearXNG app
redis:
  url: false