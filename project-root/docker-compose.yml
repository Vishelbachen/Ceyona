version: "3.9"

services:

  # =========================
  # 🧠 AI CORE
  # =========================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: 1
      WEB_CONCURRENCY: 1
      OTEL_SERVICE_NAME: ai-core

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - ai-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================
  # ⚡ REDIS CACHE / QUEUE
  # =========================
  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - ai-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# =========================
# 🌐 NETWORK ISOLATION
# =========================
networks:
  ai-network:
    driver: bridge

# =========================
# 💾 PERSISTENCE
# =========================
volumes:
  redis_data: