[project]
name = "ai-platform"
version = "1.0.0"
description = "Modular AI orchestration platform (EPK-driven)"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.130,<0.137",
    "uvicorn[standard]>=0.43,<0.50",

    "groq>=1.1,<2.0",
    "huggingface-hub>=0.20,<2.0",

    "supabase>=2.8,<3.0",
    "httpx[http2]>=0.28,<0.30",

    "redis>=5.0,<9.0",
    "tenacity>=9.1,<10.0",
    "anyio>=4.4,<5.0",

    "pydantic>=2.6,<2.14",
    "pydantic-settings>=2.3,<3.0",

    "typing-extensions>=4.14,<5.0",

    "structlog>=25.0,<27.0",
    "python-json-logger>=2.0,<5.0",

    "cryptography>=45.0,<50.0",
    "orjson>=3.10,<4.0",

    "PyJWT>=2.8,<3.0",
    "sentry-sdk>=2.0,<3.0",

    "aiogram>=3.6,<3.30",

    "python-dotenv>=1.1,<2.0",

    "lingua-language-detector>=2.0,<3.0",
    "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402", "B008"]