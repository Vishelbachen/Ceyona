name: AI-Level CI

on:
  push:
  pull_request:

jobs:
  ai-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 🧹 1. Code quality
      - name: Ruff (lint)
        run: ruff check .

      - name: MyPy (type check)
        run: mypy .

      # 🧪 2. Tests
      - name: Pytest
        run: pytest -q

      # 🔐 3. Security
      - name: Bandit security scan
        run: bandit -r app/

      # 🧠 4. Architecture check (ВАЖНО)
      - name: Detect circular imports
        run: |
          python -c "
import os, sys, ast

def check_file(path):
    with open(path, 'r', encoding='utf-8') as f:
        try:
            ast.parse(f.read())
        except Exception as e:
            print(f'❌ Syntax error in {path}: {e}')
            sys.exit(1)

for root, _, files in os.walk('app'):
    for file in files:
        if file.endswith('.py'):
            check_file(os.path.join(root, file))

print('✔ basic AST check passed')
"

      # 🧠 5. Simple architecture sanity check
      - name: Layer check
        run: |
          python -c "
import os

violations = []

for root, _, files in os.walk('app'):
    for f in files:
        if f.endswith('.py'):
            path = os.path.join(root, f)

            with open(path, encoding='utf-8') as file:
                content = file.read()

                # example rules
                if 'app/api' in root and 'model_decision' in content:
                    violations.append(path + ' should not import model_decision directly')

if violations:
    print('❌ Architecture violations:')
    for v in violations:
        print(v)
    exit(1)

print('✔ architecture OK')
"