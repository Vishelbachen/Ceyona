name: AI Production CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 🧹 CODE QUALITY
      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      # 🧪 TESTS
      - name: Run tests
        run: pytest -q

      # 🔐 SECURITY
      - name: Security scan
        run: bandit -r app/

      # 🧠 ARCHITECTURE GUARD
      - name: Architecture validation
        run: python scripts/arch_check.py

      # 🤖 AI BEHAVIOR TESTS
      - name: AI behavior tests
        run: python scripts/ai_tests.py

      # 🧠 MEMORY INTEGRITY
      - name: Memory integrity check
        run: python scripts/memory_tests.py