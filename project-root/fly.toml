app = 'ceyona'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"
  [build.args]
    CACHEBUST = "2"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1