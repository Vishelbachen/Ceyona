# fly.toml app configuration file generated for ceyona on 2026-05-19T08:45:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ceyona'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

  [build.args]
    CACHEBUST = "2"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '8gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 8192
  size = 'performance-cpu-1x'
